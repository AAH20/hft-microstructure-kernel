[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hft-microstructure-kernel"
version = "0.1.0"
description = "Algorithmic Solvers and Optimization Engine for Quantitative High-Frequency Trading & Market Microstructure Bottlenecks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Autonomous Quantitative Engine", email = "engine@market-microstructure.internal"}
]
keywords = [
    "hft",
    "market-microstructure",
    "order-book",
    "almgren-chriss",
    "avellaneda-stoikov",
    "arbitrage",
    "smart-order-router",
    "matching-engine",
    "np-hard"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics"
]

[project.scripts]
hft-kernel = "hft_microstructure_kernel.cli:main"
